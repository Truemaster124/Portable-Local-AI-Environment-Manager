name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test launcher without starting Unsloth
        shell: ${{ matrix.shell }}
        run: .\tests\Test-Launcher.ps1
