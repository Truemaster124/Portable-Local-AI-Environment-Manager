name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  npm-windows:
    name: npm CLI on Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run test:package
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test launcher without starting Unsloth
        shell: powershell
        run: .\tests\Test-Launcher.ps1
  powershell-core:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test launcher without starting Unsloth
        shell: pwsh
        run: .\tests\Test-Launcher.ps1
