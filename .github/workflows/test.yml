name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test launcher without starting Unsloth
        shell: powershell
        run: .\tests\Test-Launcher.ps1
  powershell-core:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test launcher without starting Unsloth
        shell: pwsh
        run: .\tests\Test-Launcher.ps1
