<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Connect, launch, choose</title><desc id="desc">Connect the paired SSD. Open the launcher and confirm. Select a recognized model in the installed Unsloth app. This is a schematic, not an application screenshot.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="358" rx="22" fill="#081421" stroke="#233446" stroke-width="2"/><text x="32" y="45" fill="#77ddd4" font-size="18" font-weight="700" letter-spacing="2">YOUR REPEATABLE LAUNCH ROUTINE</text><rect x="32" y="76" width="352" height="206" rx="16" fill="#103138" stroke="#60d9cc" stroke-width="2"/><circle cx="75" cy="120" r="22" fill="#7ce9dc"/><text x="75" y="127" fill="#06272b" font-size="18" font-weight="700" text-anchor="middle">01</text><text x="58" y="197" fill="#f0fcfa" font-size="39" font-weight="700" >Connect</text><text x="58" y="241" fill="#c0e8e2" font-size="22" font-weight="400" >Plug in the paired SSD.</text><path d="M393 174h21m-8 -7 8 7-8 7" fill="none" stroke="#65a4ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="424" y="76" width="352" height="206" rx="16" fill="#103138" stroke="#60d9cc" stroke-width="2"/><circle cx="467" cy="120" r="22" fill="#7ce9dc"/><text x="467" y="127" fill="#06272b" font-size="18" font-weight="700" text-anchor="middle">02</text><text x="450" y="197" fill="#f0fcfa" font-size="39" font-weight="700" >Launch</text><text x="450" y="241" fill="#c0e8e2" font-size="22" font-weight="400" >Open launcher. Confirm.</text><path d="M785 174h21m-8 -7 8 7-8 7" fill="none" stroke="#65a4ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="816" y="76" width="352" height="206" rx="16" fill="#103138" stroke="#60d9cc" stroke-width="2"/><circle cx="859" cy="120" r="22" fill="#7ce9dc"/><text x="859" y="127" fill="#06272b" font-size="18" font-weight="700" text-anchor="middle">03</text><text x="842" y="197" fill="#f0fcfa" font-size="39" font-weight="700" >Choose</text><text x="842" y="241" fill="#c0e8e2" font-size="22" font-weight="400" >Select a recognized model.</text><text x="32" y="329" fill="#a7bacf" font-size="22" font-weight="400" >Paired SSD + prepared Windows PC · Keep the drive connected throughout the session.</text></g></svg>