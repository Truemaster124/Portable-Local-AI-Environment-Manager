<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">Manual setup and the paired-drive launcher</title><desc id="desc">Manual fixed-path setup requires locating the drive, choosing a cache path, applying it, and launching. After pairing, the launcher handles drive validation and cache-path selection; you open it, confirm, and choose a model. Both workflows need a prepared PC.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1438" height="778" rx="24" fill="#081421" stroke="#233446" stroke-width="2"/><text x="48" y="65" fill="#65e0d8" font-size="20" font-weight="700" letter-spacing="3">LESS RECONFIGURATION</text><text x="48" y="125" fill="#f1f6fc" font-size="48" font-weight="700" >Same library. Fewer path chores.</text><text x="48" y="171" fill="#a7bacf" font-size="27" font-weight="400" >When the SSD gets a different drive letter, here is what changes.</text><rect x="48" y="211" width="646" height="458" rx="18" fill="#181d27" stroke="#594734" stroke-width="2"/><rect x="746" y="211" width="646" height="458" rx="18" fill="#0b242e" stroke="#1b645f" stroke-width="2"/><circle cx="80" cy="252" r="7" fill="#f5bd70"/><text x="100" y="263" fill="#ffce8a" font-size="27" font-weight="700" >MANUAL PATH SETUP</text><circle cx="778" cy="252" r="7" fill="#65e0d8"/><text x="798" y="263" fill="#72e8df" font-size="27" font-weight="700" >WITH THE LAUNCHER</text><text x="80" y="303" fill="#b9c5d3" font-size="25" font-weight="400" >A fixed path needs your attention.</text><text x="778" y="303" fill="#b9c5d3" font-size="25" font-weight="400" >Pair once, then reuse the routine.</text><rect x="77" y="332" width="45" height="45" rx="10" fill="#322b27" stroke="none" stroke-width="2"/><text x="99" y="363" fill="#ffce8a" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="139" y="363" fill="#e3e9f0" font-size="26" font-weight="500" >Find the current SSD location</text><path d="M99 381L99 402" stroke="#675039" stroke-width="3" fill="none"/><rect x="77" y="408" width="45" height="45" rx="10" fill="#322b27" stroke="none" stroke-width="2"/><text x="99" y="439" fill="#ffce8a" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="139" y="439" fill="#e3e9f0" font-size="26" font-weight="500" >Build the correct cache path</text><path d="M99 457L99 478" stroke="#675039" stroke-width="3" fill="none"/><rect x="77" y="484" width="45" height="45" rx="10" fill="#322b27" stroke="none" stroke-width="2"/><text x="99" y="515" fill="#ffce8a" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="139" y="515" fill="#e3e9f0" font-size="26" font-weight="500" >Apply it to the app session</text><path d="M99 533L99 554" stroke="#675039" stroke-width="3" fill="none"/><rect x="77" y="560" width="45" height="45" rx="10" fill="#322b27" stroke="none" stroke-width="2"/><text x="99" y="591" fill="#ffce8a" font-size="22" font-weight="700" text-anchor="middle">4</text><text x="139" y="591" fill="#e3e9f0" font-size="26" font-weight="500" >Launch and choose a model</text><rect x="775" y="332" width="45" height="45" rx="10" fill="#123f45" stroke="none" stroke-width="2"/><text x="797" y="363" fill="#72e8df" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="837" y="363" fill="#e3f5f2" font-size="26" font-weight="500" >Connect SSD + open launcher</text><path d="M797 381L797 402" stroke="#25746c" stroke-width="3" fill="none"/><rect x="775" y="408" width="45" height="45" rx="10" fill="#123f45" stroke="none" stroke-width="2"/><text x="797" y="439" fill="#72e8df" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="837" y="439" fill="#e3f5f2" font-size="26" font-weight="500" >Confirm the launch prompt</text><path d="M797 457L797 478" stroke="#25746c" stroke-width="3" fill="none"/><rect x="775" y="484" width="45" height="45" rx="10" fill="#123f45" stroke="none" stroke-width="2"/><text x="797" y="515" fill="#72e8df" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="837" y="515" fill="#e3f5f2" font-size="26" font-weight="500" >Choose a model in Unsloth</text><rect x="775" y="568" width="588" height="63" rx="12" fill="#123b3f" stroke="none" stroke-width="2"/><text x="797" y="608" fill="#8ce9db" font-size="26" font-weight="600" >Drive check + path selection handled</text><text x="48" y="721" fill="#8ea7c2" font-size="21" font-weight="700" letter-spacing="1">BOTH NEED A PREPARED PC</text><text x="48" y="757" fill="#a7bacf" font-size="24" font-weight="400" >Unsloth + runtime + enough RAM/VRAM. This is a workflow comparison, not a timing test.</text></g></svg>